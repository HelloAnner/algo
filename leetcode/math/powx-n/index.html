<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="light dark">
<title>50. Pow(x, n)</title>
<style>
  :root {
    color-scheme: light;
    /* GitHub Primer light */
    --ink: #1f2328;
    --ink-2: #59636e;
    --ink-3: #8c959f;
    --paper: #ffffff;
    --card: #ffffff;
    --line: #d1d9e0;
    --accent: #0969da;
    --accent-soft: #ddf4ff;
    --good: #1a7f37;
    --good-soft: #dafbe1;
    --warn: #cf222e;
    --warn-soft: #ffebe9;
    --code-bg: #f6f8fa;
    --tok-k: #cf222e; --tok-f: #8250df; --tok-s: #0a3069;
    --tok-c: #59636e; --tok-n: #0550ae; --tok-b: #0550ae;
    --sel: rgba(9, 105, 218, .22);
    --shadow: 0 8px 24px rgba(140, 149, 159, .2);
    --mono: "SF Mono", "JetBrains Mono", Menlo, Consolas, monospace;
    --serif: "Songti SC", "Noto Serif SC", "Source Han Serif SC", Georgia, "Times New Roman", serif;
    --sans: -apple-system, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      /* GitHub Primer dark */
      --ink: #e6edf3;
      --ink-2: #9198a1;
      --ink-3: #6e7681;
      --paper: #0d1117;
      --card: #0d1117;
      --line: #3d444d;
      --accent: #4493f8;
      --accent-soft: #121d2f;
      --good: #3fb950;
      --good-soft: #12261e;
      --warn: #f85149;
      --warn-soft: #2a1518;
      --code-bg: #161b22;
      --tok-k: #ff7b72; --tok-f: #d2a8ff; --tok-s: #a5d6ff;
      --tok-c: #8b949e; --tok-n: #79c0ff; --tok-b: #79c0ff;
      --sel: rgba(68, 147, 248, .3);
      --shadow: 0 8px 24px rgba(1, 4, 9, .8);
    }
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { font-size: 16px; }
  html, body { height: 100%; }
  body {
    background: var(--paper); color: var(--ink);
    font-family: var(--serif); line-height: 1.85;
    -webkit-font-smoothing: antialiased;
    overflow: hidden;
  }

  /* ── 分栏布局 ─────────────────────── */
  .split { display: flex; height: 100vh; }
  .pane-left { flex: 1; min-width: 0; overflow-y: auto; }
  .pane-right {
    width: 520px; flex-shrink: 0; display: flex; flex-direction: column;
    border-left: 1px solid var(--line); background: var(--card);
  }
  @media (max-width: 1100px) {
    body { overflow: auto; }
    .split { flex-direction: column; height: auto; }
    .pane-left { overflow: visible; }
    .pane-right { width: 100%; height: 82vh; border-left: none; border-top: 2px solid var(--ink); }
  }

  .page { max-width: 780px; margin: 0 auto; padding: 64px 28px 120px; }

  /* ── 页眉 ─────────────────────────── */
  .masthead {
    border-bottom: 2px solid var(--ink); padding-bottom: 20px; margin-bottom: 8px;
    display: flex; justify-content: space-between; align-items: baseline;
  }
  .masthead .brand { font-family: var(--sans); font-size: .78rem; letter-spacing: .28em; color: var(--ink-3); text-transform: uppercase; }
  .masthead .no { font-family: var(--sans); font-size: .78rem; color: var(--ink-3); }

  h1 { font-size: 2.5rem; font-weight: 700; letter-spacing: .01em; margin: 28px 0 6px; line-height: 1.25; }
  .subtitle { color: var(--ink-2); font-size: 1.05rem; margin-bottom: 22px; }

  .meta { display: flex; gap: 10px; align-items: center; margin-bottom: 40px; flex-wrap: wrap; }
  .tag {
    font-family: var(--sans); font-size: .72rem; letter-spacing: .06em;
    padding: 3px 12px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--ink-2); background: var(--card);
  }
  .tag.diff-easy { color: var(--good); border-color: var(--good); background: var(--good-soft); }

  /* ── 章节 ─────────────────────────── */
  section { margin-bottom: 56px; }
  h2 { font-size: 1.35rem; margin-bottom: 18px; display: flex; align-items: baseline; gap: 12px; }
  h2 .secno { font-family: var(--sans); font-size: .8rem; color: var(--accent); letter-spacing: .1em; font-weight: 600; }
  h2::after { content: ""; flex: 1; border-top: 1px solid var(--line); transform: translateY(-4px); }
  p { margin-bottom: 14px; }
  p, li { text-align: justify; }

  .problem-card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 26px 30px; margin-bottom: 16px; }
  .example {
    font-family: var(--mono); font-size: .85rem; line-height: 1.7;
    background: var(--code-bg); border-radius: 8px; padding: 14px 18px;
    margin: 14px 0; overflow-x: auto; white-space: pre;
  }
  .example .k { color: var(--accent); }

  code.inline { font-family: var(--mono); font-size: .86em; background: var(--code-bg); padding: 2px 7px; border-radius: 5px; }
  .insight {
    border-left: 3px solid var(--accent); background: var(--accent-soft);
    padding: 16px 22px; border-radius: 0 8px 8px 0; margin: 20px 0;
  }
  .insight .label { font-family: var(--sans); font-size: .72rem; font-weight: 700; letter-spacing: .2em; color: var(--accent); display: block; margin-bottom: 6px; }

  /* ── 可视化 ───────────────────────── */
  .viz { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 28px; margin: 22px 0; }
  .viz svg { display: block; width: 100%; height: auto; }
  .viz-msg { font-family: var(--sans); font-size: .88rem; color: var(--ink-2); min-height: 1.6em; margin-top: 18px; text-align: center; }
  .viz-controls { display: flex; justify-content: center; gap: 10px; margin-top: 14px; flex-wrap: wrap; }
  .viz-controls button {
    font-family: var(--sans); font-size: .8rem; padding: 6px 18px; border-radius: 999px;
    cursor: pointer; border: 1px solid var(--line); background: var(--card); color: var(--ink); transition: all .18s ease;
  }
  .viz-controls button:hover:not(:disabled) { border-color: var(--ink); }
  .viz-controls button:disabled { opacity: .35; cursor: default; }
  .viz-controls button.primary { background: var(--ink); color: var(--paper); border-color: var(--ink); }
  .viz-controls button.primary:hover:not(:disabled) { background: var(--accent); border-color: var(--accent); }

  /* SVG：颜色全部走 class，暗色自动适配 */
  .svg-label { font-family: var(--sans); font-size: 12px; fill: var(--ink-3); letter-spacing: 2px; }
  .svg-mono { font-family: var(--mono); fill: var(--ink); }
  .cell rect, .cell text, .cell .arr-idx { transition: all .45s cubic-bezier(.4,0,.2,1); }
  .cell rect { fill: var(--card); stroke: var(--line); stroke-width: 1.5; }
  .cell text { font-family: var(--mono); font-size: 20px; fill: var(--ink); }
  .cell .arr-idx { font-family: var(--mono); font-size: 11px; fill: var(--ink-3); }
  .cell--active rect { fill: var(--accent-soft); stroke: var(--accent); }
  .cell--hit rect { fill: var(--good-soft); stroke: var(--good); }
  .cell--hit text { fill: var(--good); font-weight: bold; }
  .pointer { transition: transform .45s cubic-bezier(.4,0,.2,1), opacity .3s; }
  .pointer path { fill: var(--accent); }
  .pointer text { font-family: var(--mono); font-size: 13px; font-weight: bold; fill: var(--accent); }
  .map-row rect { transition: all .4s ease; fill: var(--code-bg); stroke: var(--line); stroke-width: 1.5; }
  .map-row text { font-family: var(--mono); font-size: 15px; fill: var(--ink); }
  .map-row--hit rect { fill: var(--good-soft); stroke: var(--good); }
  .map-row--hit text { fill: var(--good); font-weight: bold; }

  /* ── 代码 tabs ────────────────────── */
  .tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); flex-wrap: wrap; }
  .tabs button {
    font-family: var(--sans); font-size: .82rem; padding: 8px 16px 10px;
    background: none; border: none; cursor: pointer; color: var(--ink-3);
    border-bottom: 2px solid transparent; margin-bottom: -1px; transition: color .15s;
  }
  .tabs button:hover { color: var(--ink); }
  .tabs button.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .codeblock {
    font-family: var(--mono); font-size: .85rem; line-height: 1.75;
    background: var(--code-bg); border: 1px solid var(--line); border-top: none;
    border-radius: 0 0 10px 10px; padding: 20px 24px; overflow-x: auto;
  }
  .codeblock pre { display: none; white-space: pre; }
  .codeblock pre.active { display: block; }
  .tok-k { color: var(--tok-k); } .tok-f { color: var(--tok-f); } .tok-s { color: var(--tok-s); }
  .tok-c { color: var(--tok-c); font-style: italic; } .tok-n { color: var(--tok-n); } .tok-b { color: var(--tok-b); }

  /* ── 复杂度表 ─────────────────────── */
  table.cx { width: 100%; border-collapse: collapse; margin: 18px 0; font-family: var(--sans); font-size: .88rem; }
  table.cx th {
    text-align: left; font-weight: 600; color: var(--ink-3); font-size: .74rem;
    letter-spacing: .12em; text-transform: uppercase; padding: 10px 14px; border-bottom: 2px solid var(--ink);
  }
  table.cx td { padding: 12px 14px; border-bottom: 1px solid var(--line); }
  table.cx td.mono { font-family: var(--mono); font-size: .85rem; }
  table.cx tr.best td { background: var(--good-soft); }
  table.cx tr.best td:first-child { border-left: 3px solid var(--good); }

  ol, ul { padding-left: 1.6em; }
  li { margin-bottom: 8px; }

  .footnote {
    margin-top: 80px; padding-top: 20px; border-top: 1px solid var(--line);
    font-family: var(--sans); font-size: .75rem; color: var(--ink-3);
    display: flex; justify-content: space-between;
  }

  /* ── 划线标注 ─────────────────────── */
  mark.mk { background: var(--accent-soft); border-bottom: 2px solid var(--accent); color: inherit; cursor: pointer; }
  mark.mk--c { border-bottom-style: dotted; }
  .mark-pop {
    position: fixed; z-index: 100; display: none; width: 260px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px;
    box-shadow: var(--shadow); padding: 10px; font-family: var(--sans);
  }
  .mark-pop .mp-btns { display: flex; gap: 8px; }
  .mark-pop button {
    font-size: .78rem; padding: 5px 14px; border-radius: 999px; cursor: pointer;
    border: 1px solid var(--line); background: var(--card); color: var(--ink);
  }
  .mark-pop button:hover { border-color: var(--ink); }
  .mark-pop button.warn { color: #c0392b; }
  .mark-pop textarea {
    width: 100%; height: 64px; resize: vertical; margin-bottom: 8px;
    font-family: var(--sans); font-size: .8rem; line-height: 1.5; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); outline: none;
  }

  /* ── 右侧：编辑器 + 笔记 ──────────── */
  .ed-tabs {
    display: flex; align-items: center; gap: 2px; padding: 10px 10px 0;
    border-bottom: 1px solid var(--line); overflow-x: auto; flex-shrink: 0;
  }
  .ed-tab {
    font-family: var(--sans); font-size: .78rem; padding: 7px 12px; border: none;
    background: none; color: var(--ink-3); cursor: pointer; white-space: nowrap;
    border-bottom: 2px solid transparent; display: flex; align-items: center; gap: 7px;
  }
  .ed-tab:hover { color: var(--ink); }
  .ed-tab.active { color: var(--ink); border-bottom-color: var(--accent); font-weight: 600; }
  .ed-tab .x { opacity: 0; font-size: .85rem; line-height: 1; }
  .ed-tab:hover .x { opacity: .55; }
  .ed-tab .x:hover { opacity: 1; color: #c0392b; }
  .ed-add {
    font-family: var(--sans); font-size: .9rem; border: none; background: none;
    color: var(--ink-3); cursor: pointer; padding: 6px 10px;
  }
  .ed-add:hover { color: var(--accent); }

  .editor { flex: 1; min-height: 0; position: relative; background: var(--code-bg); }
  .editor pre, .editor textarea {
    position: absolute; inset: 0; margin: 0; border: 0; outline: none;
    font-family: var(--mono); font-size: .85rem; line-height: 1.75;
    padding: 16px 18px; white-space: pre; tab-size: 4; overflow: auto;
  }
  .editor pre { pointer-events: none; z-index: 1; overflow: hidden; color: var(--ink); }
  .editor textarea {
    z-index: 2; background: transparent; color: transparent;
    caret-color: var(--ink); resize: none; font-style: normal;
  }
  .editor textarea::selection { background: var(--sel); }
  .editor textarea::placeholder { color: var(--ink-3); }

  .completion {
    position: absolute; z-index: 10; display: none; min-width: 170px; max-height: 216px; overflow-y: auto;
    background: var(--card); border: 1px solid var(--line); border-radius: 8px; box-shadow: var(--shadow);
    font-family: var(--mono); font-size: .8rem;
  }
  .ci { padding: 5px 12px; cursor: pointer; display: flex; justify-content: space-between; gap: 14px; color: var(--ink); }
  .ci.sel { background: var(--accent-soft); }
  .ci .hint { font-family: var(--sans); font-size: .66rem; color: var(--ink-3); align-self: center; }

  .ed-status {
    font-family: var(--sans); font-size: .7rem; color: var(--ink-3);
    padding: 5px 14px; border-top: 1px solid var(--line);
    display: flex; justify-content: space-between; flex-shrink: 0;
  }

  .notes { height: 210px; flex-shrink: 0; border-top: 1px solid var(--line); display: flex; flex-direction: column; background: var(--card); }
  .notes-head {
    font-family: var(--sans); font-size: .7rem; font-weight: 700; letter-spacing: .2em;
    color: var(--ink-3); padding: 8px 14px 4px; text-transform: uppercase;
  }
  .notes textarea {
    flex: 1; border: none; outline: none; resize: none; background: transparent;
    color: var(--ink); font-family: var(--sans); font-size: .85rem; line-height: 1.7; padding: 4px 14px 12px;
  }
  .notes textarea::placeholder { color: var(--ink-3); }

  @media (max-width: 600px) { .page { padding: 40px 18px 80px; } h1 { font-size: 1.9rem; } }

  /* ── 通用 viz 原语（所有可视化共用；状态只用修饰类，颜色随主题） ── */
  .cell--seen rect { fill: var(--code-bg); stroke: var(--ink-3); }
  .cell--seen text { fill: var(--ink-3); }
  .cell--dim rect, .cell--dim text { opacity: .3; }
  .vc circle { fill: var(--card); stroke: var(--line); stroke-width: 1.5; transition: all .4s cubic-bezier(.4,0,.2,1); }
  .vc text { font-family: var(--mono); font-size: 14px; fill: var(--ink); transition: all .4s; }
  .vc--active circle { fill: var(--accent-soft); stroke: var(--accent); }
  .vc--hit circle { fill: var(--good-soft); stroke: var(--good); }
  .vc--hit text { fill: var(--good); font-weight: bold; }
  .vc--seen circle { fill: var(--code-bg); stroke: var(--ink-3); }
  .vc--seen text { fill: var(--ink-3); }
  .vc--dim circle, .vc--dim text { opacity: .3; }
  .edge { stroke: var(--line); stroke-width: 1.5; fill: none; transition: stroke .4s ease; }
  .edge--active { stroke: var(--accent); stroke-width: 2.5; }
  .edge--seen { stroke: var(--ink-3); stroke-dasharray: 4 4; }
  .arrowhead { fill: var(--line); transition: fill .4s ease; }
  .arrowhead--active { fill: var(--accent); }
  .viz-note { font-family: var(--mono); font-size: 12px; fill: var(--accent); }

  /* ── 提示盒（insight 的兄弟们） ── */
  .box {
    border-left: 3px solid var(--line); background: var(--code-bg);
    padding: 14px 20px; border-radius: 0 8px 8px 0; margin: 20px 0;
  }
  .box .label {
    font-family: var(--sans); font-size: .72rem; font-weight: 700;
    letter-spacing: .2em; color: var(--ink-3); display: block; margin-bottom: 6px;
  }
  .box--tip { border-color: var(--good); background: var(--good-soft); }
  .box--tip .label { color: var(--good); }
  .box--warn { border-color: var(--warn); background: var(--warn-soft); }
  .box--warn .label { color: var(--warn); }
  .box p:last-child { margin-bottom: 0; }

  /* ── 双栏对比 ── */
  .split2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  @media (max-width: 600px) { .split2 { grid-template-columns: 1fr; } }
  .split2 .example { margin: 0; }

  /* ── 掌握程度评分 ── */
  .mastery-page { padding-top: 0; padding-bottom: 80px; }
  .mastery {
    display: flex; justify-content: space-between; align-items: center; gap: 18px;
    background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 22px 28px;
  }
  .mastery-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 4px; }
  .mastery-info { font-family: var(--sans); font-size: .78rem; color: var(--ink-3); }
  .stars { display: flex; flex-shrink: 0; }
  .stars button {
    font-size: 1.8rem; line-height: 1; padding: 0 5px; cursor: pointer;
    background: none; border: none; color: var(--line);
    transition: color .15s ease, transform .15s ease;
  }
  .stars button.on { color: var(--accent); }
  .stars button:hover { transform: scale(1.25); }
</style>
</head>

<div class="split">

  <!-- ═══ 左栏：讲解（可独立滚动） ═══ -->
  <main class="pane-left" id="pane-left">
    <div class="page" id="content">

      <div class="masthead">
        <span class="brand">ALGO · 数学</span>
        <span class="no">LEETCODE 50</span>
      </div>

      <h1>Pow(x, n)</h1>
      <p class="subtitle">powx-n — TODO 一句话题眼</p>
      <div class="meta">
        <span class="tag">TODO 难度</span>
        <span class="tag">数学</span>
      </div>

      <section>
        <h2><span class="secno">01</span>题目</h2>
        <div class="problem-card"><p>TODO</p></div>
      </section>

      <div class="footnote">
        <span>ALGO · 数学专题</span>
        <span>选中任意文字可高亮 / 写评论</span>
      </div>

    </div>

  <!-- ═══ 右栏：练习编辑器（固定） ═══ -->

        placeholder="在这里默写你的解法…"></textarea>

      <span id="ed-mode">…</span>
      <span id="ed-saved"></span>
    </div>
    <div class="notes">
      <div class="notes-head">笔记 · Notes</div>
      <textarea id="notes-ta" placeholder="这题的关键是什么？下次怎么秒想出来？"></textarea>
    </div>
  </aside>
</div>

<!-- 划线工具弹窗 -->
<div class="mark-pop" id="mark-pop"></div>

<script>
/* ═══════════════════ 题目元数据（模板变量区） ═══════════════════ */
const PROBLEM = {
  slug: 'powx-n',
  versions: {"我的解法":"def solution():\n    pass\n"}  // 右侧编辑器的初始版本与种子代码
};

// 可视化步骤机（可选）：参考 template/viz/ 与 template/COMPONENTS.md

/* ═══════════════════ 2. 讲解区代码 tabs ═══════════════════ */
document.querySelectorAll('.tabs').forEach(tabsEl => {
  const block = tabsEl.nextElementSibling;
  tabsEl.addEventListener('click', e => {
    const btn = e.target.closest('button'); if (!btn || !block) return;
    tabsEl.querySelectorAll('button').forEach(b => b.classList.toggle('active', b === btn));
    block.querySelectorAll('pre[data-tab]').forEach(p => p.classList.toggle('active', p.dataset.tab === btn.dataset.tab));
  });
});

/* ═══════════════════ 3. 持久化（服务器 ↔ localStorage 双模） ═══════════════════ */
const store = {
  // ponytail: file:// 直开时降级 localStorage；algo serve 打开时写入 ~/.algo/db.json
  mode: location.protocol === 'file:' ? 'local' : 'server',
  async load() {
    if (this.mode === 'local') {
      try { return JSON.parse(localStorage.getItem('algo:' + PROBLEM.slug)) || {}; } catch { return {}; }
    }
    try {
      const r = await fetch('/api/state?slug=' + PROBLEM.slug);
      return r.ok ? await r.json() : {};
    } catch { this.mode = 'local'; return this.load(); }
  },
  async save(state) {
    if (this.mode === 'local') { localStorage.setItem('algo:' + PROBLEM.slug, JSON.stringify(state)); return true; }
    try {
      const r = await fetch('/api/state?slug=' + PROBLEM.slug, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(state)
      });
      return r.ok;
    } catch { return false; }
  }
};

let state = { code: {}, order: [], notes: '', marks: [] };
let saveTimer = null;
const savedEl = document.getElementById('ed-saved');
const modeEl = document.getElementById('ed-mode');

function scheduleSave() {
  savedEl.textContent = '编辑中…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async () => {
    state.notes = notesTa.value;
    const ok = await store.save(state);
    savedEl.textContent = ok ? '已保存 ' + new Date().toLocaleTimeString('zh-CN', { hour: '2-digit', minute: '2-digit' }) : '保存失败';
  }, 600);
}

/* ═══════════════════ 4. Python 高亮（regex tokenizer） ═══════════════════ */
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
const PYRE = /(#[^\n]*)|('''[\s\S]*?'''|"""[\s\S]*?"""|'(?:[^'\\\n]|\\.)*'|"(?:[^"\\\n]|\\.)*")|\b(\d[\d_]*(?:\.\d+)?)\b|\b(def|return|if|elif|else|for|while|in|not|and|or|is|None|True|False|class|import|from|as|pass|break|continue|lambda|with|try|except|finally|raise|yield|assert|global|nonlocal|del)\b|\b(print|len|range|enumerate|zip|map|filter|sorted|reversed|min|max|sum|abs|int|str|float|list|dict|set|tuple|bool|isinstance|type|append|get|items|keys|values|pop|insert|extend|split|join|strip)\b/g;
function highlight(src) {
  let out = '', last = 0, m;
  PYRE.lastIndex = 0;
  while ((m = PYRE.exec(src))) {
    out += esc(src.slice(last, m.index));
    const [full, com, str, num, kw, bi] = m;
    const cls = com ? 'tok-c' : str ? 'tok-s' : num ? 'tok-n' : kw ? 'tok-k' : 'tok-b';
    out += `<span class="${cls}">${esc(full)}</span>`;
    last = m.index + full.length;
  }
  return out + esc(src.slice(last));
}

/* ═══════════════════ 5. 编辑器 ═══════════════════ */
const ta = document.getElementById('ed-ta');
const hl = document.getElementById('ed-hl');
const notesTa = document.getElementById('notes-ta');
let activeVersion = null;

function refreshHL() {
  hl.innerHTML = highlight(ta.value) + '\n';
  hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft;
}
ta.addEventListener('scroll', () => { hl.scrollTop = ta.scrollTop; hl.scrollLeft = ta.scrollLeft; });

function insert(text, caretBack = 0) {
  document.execCommand('insertText', false, text);   // 保留原生 undo 栈
  if (caretBack) ta.selectionStart = ta.selectionEnd = ta.selectionStart + caretBack;
  onEdit();
}
function onEdit() {
  state.code[activeVersion] = ta.value;
  refreshHL();
  completion.trigger();
  scheduleSave();
}

const PAIRS = { '(': ')', '[': ']', '{': '}', '"': '"', "'": "'" };
ta.addEventListener('keydown', e => {
  if (completion.handleKey(e)) return;
  const { selectionStart: s, selectionEnd: en, value: v } = ta;
  if (e.key === 'Tab') {
    e.preventDefault(); insert('    ');
  } else if (e.key === 'Enter') {
    e.preventDefault();
    const line = v.slice(v.lastIndexOf('\n', s - 1) + 1, s);
    const indent = (line.match(/^\s*/) || [''])[0];
    insert('\n' + indent + (/:\s*(#.*)?$/.test(line) ? '    ' : ''));
  } else if (PAIRS[e.key] && !e.metaKey && !e.ctrlKey) {
    e.preventDefault();
    if (s !== en) {  // 选中一段 → 用括号包起来
      const sel = v.slice(s, en);
      ta.setRangeText(e.key + sel + PAIRS[e.key], s, en, 'end');
      ta.setSelectionRange(s + 1, en + 1);
      onEdit();
    } else insert(e.key + PAIRS[e.key], -1);
  } else if (')]}"\''.includes(e.key) && s === en && v[s] === e.key) {
    e.preventDefault(); ta.selectionStart = ta.selectionEnd = s + 1;   // 跳过已配对的右括号
  } else if (e.key === 'Backspace' && s === en && s > 0 && PAIRS[v[s-1]] === v[s]) {
    e.preventDefault();
    ta.setSelectionRange(s - 1, s + 1);
    document.execCommand('delete');   // 删除空括号对
    onEdit();
  }
});
ta.addEventListener('input', onEdit);

/* ── 补全：来自当前文档的词频 + 内建函数 ── */
const completion = {
  el: document.getElementById('completion'),
  items: [], idx: 0, prefix: '', open: false,
  trigger() {
    const s = ta.selectionStart;
    const m = ta.value.slice(0, s).match(/[A-Za-z_]\w*$/);
    if (!m || m[0].length < 2) return this.close();
    this.prefix = m[0];
    const freq = {};
    (ta.value.match(/[A-Za-z_]\w{2,}/g) || []).forEach(w => { if (w !== this.prefix) freq[w] = (freq[w] || 0) + 1; });
    const doc = Object.keys(freq).sort((a, b) => freq[b] - freq[a]);
    const builtins = ['print', 'len', 'range', 'enumerate', 'append', 'get', 'items', 'sorted'];
    this.items = [...new Set([...doc, ...builtins])]
      .filter(w => w.startsWith(this.prefix) && w !== this.prefix).slice(0, 8)
      .map(w => ({ w, hint: doc.includes(w) ? '文档' : '内建' }));
    this.items.length ? (this.idx = 0, this.show()) : this.close();
  },
  show() {
    const p = caretPos();
    this.el.style.left = Math.min(p.left, ta.clientWidth - 180) + 'px';
    this.el.style.top = Math.min(p.top + 6, ta.clientHeight - 100) + 'px';
    this.el.innerHTML = this.items.map((it, i) =>
      `<div class="ci${i === this.idx ? ' sel' : ''}" data-w="${it.w}"><span>${esc(it.w)}</span><span class="hint">${it.hint}</span></div>`).join('');
    this.el.style.display = 'block';
    this.open = true;
  },
  close() { this.el.style.display = 'none'; this.open = false; },
  handleKey(e) {
    if (!this.open) return false;
    if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
      e.preventDefault();
      this.idx = (this.idx + (e.key === 'ArrowDown' ? 1 : -1) + this.items.length) % this.items.length;
      this.show(); return true;
    }
    if (e.key === 'Enter' || e.key === 'Tab') { e.preventDefault(); this.accept(this.items[this.idx].w); return true; }
    if (e.key === 'Escape') { this.close(); return true; }
    return false;
  },
  accept(w) {
    const s = ta.selectionStart;
    ta.setSelectionRange(s - this.prefix.length, s);
    document.execCommand('insertText', false, w);
    this.close(); onEdit(); ta.focus();
  }
};
completion.el.addEventListener('mousedown', e => {
  e.preventDefault();
  const ci = e.target.closest('.ci');
  if (ci) completion.accept(ci.dataset.w);
});
function caretPos() {  // mirror-div 法测光标像素位置
  const cs = getComputedStyle(ta);
  const d = document.createElement('div');
  d.style.cssText = `position:absolute;visibility:hidden;white-space:pre;font:${cs.font};` +
    `line-height:${cs.lineHeight};padding:${cs.padding};width:${ta.clientWidth}px;tab-size:4;`;
  d.textContent = ta.value.slice(0, ta.selectionStart);
  const marker = document.createElement('span'); marker.textContent = '​'; d.appendChild(marker);
  document.body.appendChild(d);
  const r = marker.getBoundingClientRect(), dr = d.getBoundingClientRect();
  document.body.removeChild(d);
  return { left: r.left - dr.left - ta.scrollLeft, top: r.top - dr.top - ta.scrollTop + parseFloat(cs.lineHeight) };
}

/* ── 版本 tabs ── */
const edTabs = document.getElementById('ed-tabs');
function renderTabs() {
  edTabs.innerHTML = '';
  state.order.forEach(name => {
    const b = document.createElement('button');
    b.className = 'ed-tab' + (name === activeVersion ? ' active' : '');
    b.innerHTML = esc(name) + (PROBLEM.versions[name] === undefined ? ' <span class="x">×</span>' : '');
    b.onclick = () => switchVersion(name);
    const x = b.querySelector('.x');
    if (x) x.onclick = e => {
      e.stopPropagation();
      if (!confirm(`删除版本「${name}」？`)) return;
      delete state.code[name];
      state.order = state.order.filter(v => v !== name);
      if (activeVersion === name) switchVersion(state.order[0]); else renderTabs();
      scheduleSave();
    };
    edTabs.appendChild(b);
  });
  const add = document.createElement('button');
  add.className = 'ed-add'; add.textContent = '+';
  add.title = '新版本';
  add.onclick = () => {
    const name = prompt('版本名称（如：递归版、二刷）');
    if (!name || state.code[name] !== undefined) return;
    state.order.push(name);
    state.code[name] = `# ${name}\n`;
    switchVersion(name);
    scheduleSave();
  };
  edTabs.appendChild(add);
}
function switchVersion(name) {
  activeVersion = name;
  ta.value = state.code[name] ?? '';
  refreshHL(); renderTabs();
}

/* ═══════════════════ 6. 划线标注（text-quote 锚点） ═══════════════════ */
const content = document.getElementById('content');
const paneLeft = document.getElementById('pane-left');
const markPop = document.getElementById('mark-pop');
let pendingRange = null;

const fullText = () => content.textContent;

function anchorOf(range) {
  const r = document.createRange();
  r.selectNodeContents(content);
  r.setEnd(range.startContainer, range.startOffset);
  const start = r.toString().length;
  const text = range.toString();
  const full = fullText();
  return {
    text,
    prefix: full.slice(Math.max(0, start - 40), start),
    suffix: full.slice(start + text.length, start + text.length + 40),
  };
}
function wrapRange(range, id, hasComment) {
  const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
  const nodes = []; let n;
  while ((n = walker.nextNode())) if (range.intersectsNode(n)) nodes.push(n);
  nodes.forEach(node => {
    const s = node === range.startContainer ? range.startOffset : 0;
    const e = node === range.endContainer ? range.endOffset : node.length;
    if (s >= e) return;
    const r = document.createRange();
    r.setStart(node, s); r.setEnd(node, e);
    const mk = document.createElement('mark');
    mk.className = 'mk' + (hasComment ? ' mk--c' : '');
    mk.dataset.id = id;
    try { r.surroundContents(mk); } catch { /* 跨元素边缘跳过 */ }
  });
}
/* ponytail: 恢复时先精确匹配 prefix+text+suffix，退化到首个 text 命中；HTML 大改后找不到就静默丢弃 */
function locateMark(mk) {
  const full = fullText();
  let idx = full.indexOf(mk.prefix + mk.text + mk.suffix);
  if (idx >= 0) idx += mk.prefix.length;
  else { idx = full.indexOf(mk.text); }
  if (idx < 0) return null;
  const range = document.createRange();
  const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
  let pos = 0, n, startSet = false;
  while ((n = walker.nextNode())) {
    const len = n.length;
    if (!startSet && pos + len > idx) { range.setStart(n, idx - pos); startSet = true; }
    if (startSet && pos + len >= idx + mk.text.length) { range.setEnd(n, idx + mk.text.length - pos); return range; }
    pos += len;
  }
  return null;
}
function hidePop() { markPop.style.display = 'none'; pendingRange = null; }
function showPop(rect, html) {
  markPop.innerHTML = html;
  markPop.style.display = 'block';
  markPop.style.left = Math.min(rect.left, innerWidth - 280) + 'px';
  markPop.style.top = (rect.bottom + 8) + 'px';
}
function createMark(range, comment) {
  const mk = { id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6), ...anchorOf(range), comment };
  wrapRange(range, mk.id, !!comment);
  state.marks.push(mk);
  scheduleSave();
}
document.addEventListener('mouseup', e => {
  if (e.target.closest('.pane-right') || e.target.closest('.mark-pop')) return;
  const mk = e.target.closest('mark.mk');
  if (mk) {  // 点击已有标注 → 查看/编辑评论
    const m = state.marks.find(x => x.id === mk.dataset.id);
    if (!m) return;
    showPop(mk.getBoundingClientRect(),
      `<textarea id="mp-comment" placeholder="写点评论…">${esc(m.comment || '')}</textarea>
       <div class="mp-btns"><button id="mp-save">保存</button><button id="mp-del" class="warn">删除标注</button></div>`);
    document.getElementById('mp-save').onclick = () => {
      m.comment = document.getElementById('mp-comment').value;
      document.querySelectorAll(`mark.mk[data-id="${m.id}"]`).forEach(el =>
        el.classList.toggle('mk--c', !!m.comment));
      scheduleSave(); hidePop();
    };
    document.getElementById('mp-del').onclick = () => {
      state.marks = state.marks.filter(x => x.id !== m.id);
      document.querySelectorAll(`mark.mk[data-id="${m.id}"]`).forEach(el => el.replaceWith(...el.childNodes));
      content.normalize();
      scheduleSave(); hidePop();
    };
    return;
  }
  setTimeout(() => {  // 新选区 → 工具条
    const sel = getSelection();
    if (sel.isCollapsed || !sel.toString().trim() || !content.contains(sel.anchorNode)) return;
    pendingRange = sel.getRangeAt(0).cloneRange();
    showPop(pendingRange.getBoundingClientRect(),
      `<div class="mp-btns"><button id="mp-hl">高亮</button><button id="mp-cm">✎ 评论</button></div>`);
    document.getElementById('mp-hl').onclick = () => { createMark(pendingRange, null); hidePop(); getSelection().removeAllRanges(); };
    document.getElementById('mp-cm').onclick = () => {
      showPop(pendingRange.getBoundingClientRect(),
        `<textarea id="mp-new" placeholder="写点评论…" autofocus></textarea>
         <div class="mp-btns"><button id="mp-ok">保存评论</button></div>`);
      document.getElementById('mp-ok').onclick = () => {
        createMark(pendingRange, document.getElementById('mp-new').value);
        hidePop(); getSelection().removeAllRanges();
      };
    };
  }, 10);
});
document.addEventListener('mousedown', e => { if (!e.target.closest('.mark-pop')) hidePop(); });
paneLeft.addEventListener('scroll', hidePop);

/* ═══════════════════ 8. 掌握程度评分（艾宾浩斯阶梯） ═══════════════════ */
const RATE_LABEL = { 1: '完全没印象', 2: '基本不会', 3: '看了提示才会', 4: '顺利写出', 5: '秒答' };
const starsEl = document.getElementById('stars');
const masteryInfo = document.getElementById('mastery-info');
function renderMastery(m) {
  starsEl.querySelectorAll('button').forEach(b => b.classList.toggle('on', +b.dataset.r <= (m.rating || 0)));
  masteryInfo.textContent = m.rating
    ? `${m.rating}★ ${RATE_LABEL[m.rating]} · 第 ${m.count} 次复习 · 下次复习 ${m.due}`
    : '还没有评分记录 · 复习完给自己打个星';
}
starsEl.addEventListener('click', async e => {
  const b = e.target.closest('button'); if (!b) return;
  const rating = +b.dataset.r;
  if (store.mode === 'server') {
    try {  // 调度逻辑在 CLI 的 applyReview，单一事实源
      const r = await fetch(`/api/review?slug=${PROBLEM.slug}&rating=${rating}`, { method: 'POST' });
      return renderMastery({ ...(await r.json()), rating });
    } catch { /* 掉线走本地 */ }
  }
  // ponytail: local 模式前端重算同一套阶梯，STAGES 必须与 cli/src/index.ts 保持一致
  const STAGES = [1, 2, 4, 7, 15, 30, 90];
  let stage = state.stage ?? 0;
  if (rating <= 2) stage = 0;
  else if (rating >= 4) stage = Math.min(stage + (rating === 5 ? 2 : 1), STAGES.length - 1);
  const due = new Date(Date.now() + STAGES[stage] * 864e5).toISOString().slice(0, 10);
  state.stage = stage; state.due = due;
  state.reviews = [...(state.reviews ?? []), { date: due.slice(0, 10), rating }];
  renderMastery({ rating, due, count: state.reviews.length });
  store.save(state);
});

/* ═══════════════════ 7. 启动：载入状态 ═══════════════════ */
(async function boot() {
  const saved = await store.load();
  state.order = saved.order?.length ? saved.order : Object.keys(PROBLEM.versions);
  state.order.forEach(v => state.code[v] = saved.code?.[v] ?? PROBLEM.versions[v] ?? '');
  state.marks = saved.marks || [];
  notesTa.value = saved.notes || '';
  modeEl.textContent = store.mode === 'server' ? '已连接 ~/.algo/db.json' : '本地模式（algo serve 可同步到 ~/.algo）';
  switchVersion(state.order[0]);
  renderMastery({ rating: saved.reviews?.at(-1)?.rating ?? 0, due: saved.due, count: saved.reviews?.length ?? 0 });
  state.marks.forEach(mk => {  // 恢复划线
    const r = locateMark(mk);
    if (r) wrapRange(r, mk.id, !!mk.comment);
  });
})();
notesTa.addEventListener('input', scheduleSave);
window.addEventListener('beforeunload', () => {  // 兜底存一次
  state.notes = notesTa.value;
  if (store.mode === 'local') store.save(state);
  else navigator.sendBeacon('/api/state?slug=' + PROBLEM.slug, JSON.stringify(state));
});
</script>
