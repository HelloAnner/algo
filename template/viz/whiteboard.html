<!-- ══════════════════════════════════════════════════════════════
  白板图解（精确几何 SVG · 一题一张，说清算法全貌）

  用法：整块复制进 CONTENT 的某个 <section>，只改 <svg> 内容。
  全屏按钮免接线（base.html 已全局绑定 .wb-full）。

  铁律（都是为了不重叠、不粗糙）：
  1. 禁止 feTurbulence / 手绘抖动滤镜——它会甩歪文字造成重叠。
     白板是"精确几何图解"，不是手绘模拟。
  2. 画布三段式布局（720 宽）：
       标题区   y = 40（font-size 19）
       图形区   y = 60 ~ 210
       注解区   y = 240 起，每行行距 ≥ 34（① ② ③ 编号）
       底部小字 y = 画布高 − 14（font-size 12，放复杂度/口诀）
     结论绿框固定右侧 x ≈ 460-470，w 210 h 52。
  3. 文字 ≥ 12px；标注与图形间距 ≥ 10px；两行长文字垂直间距 ≥ 30px；
     画完自查：任何两个 text 的包围盒不重叠。
  4. 颜色语义（固定四色记号笔，豁免主题变量——白板亮暗模式都是白板）：
       wb-k 黑 = 结构　wb-b 蓝 = 关键问题/判断　wb-r 红 = 指针/步骤/圈重点　wb-g 绿 = 结果/结论
  5. 所有形状必须写 fill="none"（SVG 默认黑填充！）；底色用 wb-soft-*。
  6. 文字一律 class="wb-t"（系统默认无衬线）；改色叠加 wb-fb / wb-fr / wb-fg；
     行内多色用 <tspan class="wb-fr">①</tspan>。
  7. 箭头统一用 wb1-arr marker（多白板时 id 加后缀 wb2-arr）。
  8. 一张图只讲一件事：初始状态 → 关键动作 → 结论。细节推演交给步骤机。
  完整参考：leetcode/array/two-sum/index.html 第 03 节
════════════════════════════════════════════════════════════════ -->

<div class="whiteboard">
  <button class="wb-full" title="全屏">⛶ 全屏</button>
  <svg viewBox="0 0 720 360" role="img" aria-label="算法白板图解">
    <defs>
      <marker id="wb1-arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#2b2b2b"/>
      </marker>
    </defs>
    <text x="28" y="40" class="wb-t" font-size="19">一句话说清这个算法</text>

    <!-- 图形区：结构（黑） -->
    <rect x="40" y="76" width="52" height="52" rx="6" class="wb-k" fill="none" stroke-width="2"/>
    <text x="66" y="110" class="wb-t" font-size="19" text-anchor="middle">…</text>

    <!-- 关键问题（蓝） -->
    <text x="40" y="200" class="wb-t wb-fb" font-size="15">每一步在问什么？</text>

    <!-- 注解区：步骤（红编号） -->
    <text x="40" y="252" class="wb-t" font-size="15"><tspan class="wb-fr">①</tspan> 第一步…</text>
    <text x="40" y="286" class="wb-t" font-size="15"><tspan class="wb-fr">②</tspan> 第二步…</text>

    <!-- 结论（绿），固定右侧 -->
    <rect x="460" y="248" width="210" height="52" rx="10" class="wb-g wb-soft-g" stroke-width="2"/>
    <text x="478" y="281" class="wb-t wb-fg" font-size="16">return …</text>

    <!-- 底部小字 -->
    <text x="40" y="346" class="wb-t" font-size="12">O(n) · O(1) ｜ 一句口诀</text>
  </svg>
</div>
